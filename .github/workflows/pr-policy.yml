name: PR policy
# Structural check of the PR title and description (.github/scripts/pr_policy.py). It does not judge code quality.
#
# Why pull_request_target: on `pull_request`, the workflow definition itself comes from the PR, so a contributor could
# edit this file or the checker and make "PR policy" pass. On `pull_request_target`, both the workflow definition and
# the checked-out checker come from the PR's base branch; for PRs into `main` that is protected code. That is what
# lets this check be trusted as a required status check.
#
# SECURITY (pull_request_target runs with the base repository's context, so the rules are strict):
#   - never check out, build, or run anything from the PR head (no `ref: ...head...`, no PR artifacts or caches);
#   - the only PR-controlled inputs are the title and body, passed as environment variables, never interpolated
#     into a shell command;
#   - no secrets are referenced; the token is read-only (`contents: read`) and not persisted by checkout;
#   - only one file is checked out: the checker, from the base branch.
# Tests of changes to the checker run separately, on `pull_request`, in repo-checks.yml.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- runs base-branch code only, read-only token, no secrets
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: PR policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the base branch's checker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          sparse-checkout: .github/scripts/pr_policy.py
          sparse-checkout-cone-mode: false
      - name: Check title and description with the base branch's checker
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/pr_policy.py
