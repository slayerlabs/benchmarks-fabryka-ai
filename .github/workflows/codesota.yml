name: CodeSOTA CI
# Checks for benchmarks/ (CodeSOTA v2), independent of the research/ test environment.
#
# It runs on every PR so that the final `CodeSOTA CI` job always reports and can later be made a required check
# without leaving unrelated PRs pending. The test job runs only when the PR touches benchmarks/ or this file;
# otherwise it is skipped and `CodeSOTA CI` reports success.
#
# SECURITY: `pull_request` only (fork PRs get a read-only token and no secrets); no PR-controlled text is
# interpolated into a shell; actions are pinned to commit SHAs (benchmarks/docs/security-and-governance.md).
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - ".github/workflows/codesota.yml"

permissions: {}

concurrency:
  group: codesota-ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; runs on main are not, so every main commit keeps a completed result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect v2 changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # list the files a PR changes (gh api .../pulls/N/files)
    outputs:
      v2: ${{ steps.files.outputs.v2 }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "v2=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # New and old paths, so a rename out of benchmarks/ counts. A here-string, not a pipe: with pipefail an
          # early grep match could SIGPIPE the writer and turn a match into "no v2 changes".
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -Eq '^(benchmarks/|\.github/workflows/codesota\.yml$)' <<< "$files"; then
            echo "v2=true" >> "$GITHUB_OUTPUT"
          else
            echo "v2=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Lint, type-check, test, build
    needs: changes
    if: needs.changes.outputs.v2 == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: benchmarks
    steps:
      # Full checkout: the docs tests check links from benchmarks/ into research/ and .github/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build

  result:
    name: CodeSOTA CI
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "changes: $CHANGES, test: $TEST"
          [ "$CHANGES" = "success" ] && { [ "$TEST" = "success" ] || [ "$TEST" = "skipped" ]; }
