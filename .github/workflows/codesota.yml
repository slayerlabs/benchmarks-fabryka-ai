name: CodeSOTA CI
# Checks for benchmarks/ (the codesota package), independent of the research/ test environment.
#
# It runs on every PR GitHub runs workflows for, so that the final `CodeSOTA CI` job reports and can later be required
# without leaving unrelated PRs pending. The test job runs only when the PR touches benchmarks/, this file, or the
# change detector (.github/scripts/codesota_changes.py, which fails closed); otherwise it is skipped and
# `CodeSOTA CI` reports success.
#
# Trust: this is CI of contributor code, so it runs the PR's own version of this workflow and its scripts. A PR can
# weaken it; changes under .github/ need human review (benchmarks/docs/security-and-governance.md).
#
# SECURITY: `pull_request` only (fork PRs get a read-only token and no secrets); no PR-controlled text is
# interpolated into a shell; actions are pinned to commit SHAs.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - ".github/workflows/codesota.yml"
      - ".github/scripts/codesota_changes.py"

permissions: {}

concurrency:
  # One group per PR (a superseded run is cancelled) and one per pushed commit on main (never cancelled or dropped:
  # GitHub keeps only one pending run per group, so a shared main group could skip commits).
  group: codesota-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect benchmarks/ changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the change detector
      pull-requests: read # list the files a PR changes (gh api .../pulls/N/files)
    outputs:
      v2: ${{ steps.files.outputs.v2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/codesota_changes.py
          sparse-checkout-cone-mode: false
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "v2=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # New and old path of every file (a rename out of benchmarks/ counts). An API error fails this job, and
          # the aggregator fails with it.
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | [.filename, (.previous_filename // "")] | @tsv' > "$RUNNER_TEMP/files.tsv"
          python3 .github/scripts/codesota_changes.py < "$RUNNER_TEMP/files.tsv" >> "$GITHUB_OUTPUT"

  test:
    name: Lint, type-check, test, build
    needs: changes
    if: needs.changes.outputs.v2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: benchmarks
    steps:
      # Full checkout: the docs tests check links from benchmarks/ into research/ and .github/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build

  eval:
    name: Runner tests (eval extra)
    # The runner's tests need lm-eval and the CPU build of torch: a separate job, so the default environment above
    # stays free of them. Offline after the install: the tests use synthetic documents and a fake model.
    needs: changes
    if: needs.changes.outputs.v2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: benchmarks
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      # Full checkout: the tests compare the runner with research/common/ and research/benchmarks/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          enable-cache: false
      - run: uv sync --locked --extra eval
      # Fails if the extra is missing, so the runner tests cannot be skipped silently.
      - run: uv run python -c "import lm_eval, torch; print(lm_eval.__version__, torch.__version__)"
      - run: uv run pytest tests/test_runner.py

  result:
    name: CodeSOTA CI
    needs: [changes, test, eval]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the verdict function
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/codesota_changes.py
          sparse-checkout-cone-mode: false
      # Passes only when detection succeeded with a definite decision, and the tests passed, or were skipped because
      # the decision was "no benchmarks/ changes". Failed, cancelled, or timed-out jobs fail it (codesota_changes.verdict).
      - env:
          CHANGES: ${{ needs.changes.result }}
          V2: ${{ needs.changes.outputs.v2 }}
          # Both test jobs run or skip together; the verdict reads the eval job once the default one passed.
          TEST: ${{ needs.test.result == 'success' && needs.eval.result || needs.test.result }}
        run: python3 .github/scripts/codesota_changes.py --verdict
